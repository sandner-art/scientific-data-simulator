[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-data-simulator"
version = "0.7.0.dev0"
description = "Reproducible, provenance-first generation of simulated scientific reference data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daniel Sandner" }]
requires-python = ">=3.11"  # 3.9 and 3.10 are end-of-life; Pillow's security fixes need 3.11+
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "psutil>=5.9",
    "matplotlib>=3.6",
    # Security floor: Pillow 13.0.0 (16 Oct 2026) fixes CVE-2026-112900 (EPS filenames reaching
    # Ghostscript) and memory-corruption bugs in its TIFF and JPEG decoders. Pillow comes in through
    # matplotlib (and Streamlit); this keeps a resolver from settling on an older one.
    "pillow>=13.0",
    "plotly>=5.0",
]

[project.scripts]
sds = "simulator.cli:main"

[project.optional-dependencies]
# Install profiles used by scripts/install.*: core (no extra), standard, all, dev.
standard = ["kaleido>=1.0", "plotly>=6.1.1", "pyarrow>=12", "h5py>=3.8", "pint>=0.24"]
# Static export of plotly figures (svg/pdf/png). Kaleido >= 1.0 needs a Chrome install
# and plotly >= 6.1.1 (older plotly prints deprecation warnings about 'engine').
static-plots = ["kaleido>=1.0", "plotly>=6.1.1"]
# Columnar storage of DataFrame outputs; Hugging Face dataset export.
parquet = ["pyarrow>=12"]
huggingface = ["pyarrow>=12"]
# Single-file HDF5 storage of array outputs.
hdf5 = ["h5py>=3.8"]
the-well = ["h5py>=3.8", "pyyaml>=5.4"]
# Physical units (unit-bearing parameters, unit checks of outputs).
units = ["pint>=0.24"]
# Validate exported datasets (Croissant metadata, loading with datasets).
validate = ["mlcroissant>=1.0", "datasets>=2.18"]
# Using exported RL packages (writing them needs nothing extra). openenv and
# verifiers pin incompatible 'mcp' versions: install them in separate environments.
openenv = ["openenv>=0.12"]
verifiers = ["verifiers>=0.4.1"]
docs = ["sphinx>=7", "sphinx-rtd-theme", "myst-parser"]
dev = ["pytest>=7", "pyarrow>=12", "h5py>=3.8", "kaleido>=1.0", "plotly>=6.1.1", "pint>=0.24"]
all = ["kaleido>=1.0", "plotly>=6.1.1", "pyarrow>=12", "h5py>=3.8", "pint>=0.24", "mlcroissant>=1.0", "datasets>=2.18"]

[project.urls]
Homepage = "https://github.com/sandner-art/scientific-data-simulator"

[tool.setuptools.packages.find]
include = ["simulator*", "experiments*"]  # the bundled models are importable after any install

[tool.pytest.ini_options]
testpaths = ["tests"]
# Reference models in experiments/ and examples/ are imported from the repository root.
pythonpath = ["."]
