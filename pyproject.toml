[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-data-simulator"
version = "0.2.0.dev0"
description = "Reproducible, provenance-first generation of simulated scientific reference data."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Daniel Sandner" }]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "scipy>=1.9",
    "pandas>=1.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
    "psutil>=5.9",
    "matplotlib>=3.6",
    "plotly>=5.0",
]

[project.optional-dependencies]
# Static export of plotly figures (svg/pdf/png). Kaleido >= 1.0 needs a Chrome install.
static-plots = ["kaleido"]
# Columnar storage of DataFrame outputs.
parquet = ["pyarrow>=12"]
# Single-file HDF5 storage of array outputs.
hdf5 = ["h5py>=3.8"]
dev = ["pytest>=7", "pyarrow>=12", "h5py>=3.8", "kaleido"]
docs = ["sphinx>=7", "sphinx-rtd-theme", "myst-parser"]
all = ["kaleido", "pyarrow>=12", "h5py>=3.8"]

[project.urls]
Homepage = "https://github.com/sandner-art/scientific-data-simulator"

[tool.setuptools.packages.find]
include = ["simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Reference models in experiments/ and examples/ are imported from the repository root.
pythonpath = ["."]
