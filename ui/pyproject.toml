[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "scientific-data-simulator-ui"
version = "0.7.0.dev0"  # released together with the simulator, same version
description = "Streamlit UI for Scientific Data Simulator: examples, runs, results, installation check"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Daniel Sandner"}]
requires-python = ">=3.11"
dependencies = [
    "scientific-data-simulator>=0.7.0.dev0",
    # 1.67 is the first Streamlit that accepts Pillow 13 (earlier releases cap it below 13);
    # the floor also makes pip upgrade an older Streamlit that is already installed.
    "streamlit>=1.67",
    "pillow>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sds-ui = "sds_ui.cli:main"

[tool.setuptools.packages.find]
include = ["sds_ui*"]
