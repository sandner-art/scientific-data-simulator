[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scidatasim-ui"
version = "0.7.0rc2"  # released together with the simulator, same version
description = "Streamlit UI for Scientific Data Simulator: examples, runs, results, installation check"
readme = "README.md"
license = "Apache-2.0"
authors = [{name = "Daniel Sandner"}]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies = [
    "scidatasim>=0.7.0rc2",
    # 1.67 is the first Streamlit that accepts Pillow 13 (earlier releases cap it below 13);
    # the floor also makes pip upgrade an older Streamlit that is already installed.
    "streamlit>=1.67",
    "pillow>=13.0",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
sds-ui = "sds_ui.cli:main"

[project.urls]
Homepage = "https://github.com/sandner-art/scientific-data-simulator"
Source = "https://github.com/sandner-art/scientific-data-simulator/tree/main/ui"
Issues = "https://github.com/sandner-art/scientific-data-simulator/issues"

[tool.setuptools.packages.find]
include = ["sds_ui*"]
