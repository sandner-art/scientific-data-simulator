# examples/example_9_discovery_env/env.yaml
# An interactive "run experiments, then report" task over the predator-prey model.
description: >
  You are studying a predator-prey ecosystem. Each experiment sets the initial
  populations and returns noisy, sampled counts over 30 time units.

base_config:
  experiment_type: experiments.predator_prey.logic.PredatorPreyExperiment
  n_steps: 3000
  dt: 0.01
  integrator: rk4
  clamp_negative: false
  initial_prey: 10.0
  initial_predators: 5.0
  prey_growth_rate: 1.1        # replaced by the hidden value in every episode
  prey_death_rate: 0.4
  predator_growth_rate: 0.1
  predator_death_rate: 0.4
  observation:
    sampling: {every: 50}
    operators:
      # Relative (log-normal) error suits counts that span orders of magnitude.
      # (snr_db would set ONE noise level from the RMS of the whole series,
      # which swamps the small early values of an exponentially growing series.)
      - {type: multiplicative, sigma: 0.05}

hidden:
  prey_growth_rate: [0.6, 1.6]   # drawn uniformly per episode
controls:
  initial_prey: [1, 50]
  initial_predators: [0, 20]
target: prey_growth_rate
budget: 3
tolerance: 0.05
max_points: 61
