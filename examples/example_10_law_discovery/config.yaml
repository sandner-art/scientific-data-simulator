# examples/example_10_law_discovery/config.yaml
# Base configuration of the law-discovery suite (law, counterfactual and snr_db are swept).
experiment_type: experiments.law_discovery.logic.HiddenLawExperiment
experiment_description: "Hidden laws y = f(x), textbook and counterfactual, with noisy observations."
seed: 20261108
law: random
counterfactual: false
n_points: 40

observation:
  operators:
    - {type: gaussian, snr_db: 30}    # swept

bundle:
  figure: {format: png, show_latent: false}   # the exact curve is hidden: inference only
  qa: {value_queries: 0}
generate_plots: false
