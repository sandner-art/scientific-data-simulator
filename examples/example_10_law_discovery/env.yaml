# examples/example_10_law_discovery/env.yaml
# Interactive law discovery: choose where to measure, then report the law as a formula.
description: >
  An unknown physical relation y = f(x) is hidden in an instrument. Each experiment
  measures y (with noise) at n points spread evenly between x_min and x_max.

base_config:
  experiment_type: experiments.law_discovery.logic.HiddenLawExperiment
  n_points: 30
  counterfactual: true          # structural constants differ from textbook values
  x_min: 0.5
  x_max: 5.0
  observation:
    operators:
      - {type: gaussian, snr_db: 40}

hidden:
  law: {choices: [power_law, inverse_square, exponential_decay, michaelis_menten, hill, arrhenius]}
  law_seed: [0, 4.0e15]         # draws the law's parameters (a wide range: no brute force)

controls:
  x_min: [0.1, 9.0]
  x_max: [0.5, 10.0]

target: law_expression
target_type: expression
domain: [0.5, 5.0]
budget: 3
tolerance: 0.02                 # relative RMS on the domain
max_points: 30
