name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Test
        # Static plotly export needs kaleido + Chrome; the suite skips it when absent.
        run: python -m pytest -q

  install-scripts:
    # The install scripts as a new user runs them, then the doctor and two quick examples.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (bash)
        if: runner.os != 'Windows'
        run: |
          bash scripts/install.sh core
          .venv/bin/sds doctor
          .venv/bin/sds examples check --run-quick --only example_1 example_9_discovery_env
          bash scripts/update.sh
      - name: Install (cmd -> PowerShell)
        if: runner.os == 'Windows'
        shell: cmd
        env:
          SDS_NOPAUSE: "1"
        run: |
          call scripts\install.cmd core || exit /b 1
          .venv\Scripts\sds.exe doctor || exit /b 1
          .venv\Scripts\sds.exe examples check --run-quick --only example_1 example_9_discovery_env || exit /b 1
          call scripts\update.cmd || exit /b 1

  examples:
    # Every example in its quick mode, through the same runner the CLI (and a UI) uses.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[standard]"
      - name: Examples (quick)
        run: sds examples check --run-quick

  ui:
    # The UI package with its headless tests (Streamlit AppTest): every page and a real example run.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: windows-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[standard]" -e ./ui pytest
      - name: Test
        run: python -m pytest -q ui/tests
